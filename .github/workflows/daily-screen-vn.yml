name: Daily Stock Screen VN

on:
  # schedule:
  #   # Every weekday at 00:00 UTC
  #   - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-vn
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT || 'https://stock-helper-resource.services.ai.azure.com/api/projects/stock-helper' }}
      AGENT_NAME: ${{ vars.AZURE_AI_AGENT_NAME_VN || 'stock-vn-forecast-agent' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        id: install
        env:
          PIP_CACHE_DIR: ~/.cache/pip
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Run daily screen job
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_VN_MESSAGE_THREAD_ID || '1454' }}
          TELEGRAM_AI_TOP_PICKS_THREAD_ID: ${{ vars.TELEGRAM_VN_AI_TOP_PICKS_THREAD_ID || '1455' }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VN_WEEKLY_MAX_HISTORY_CALLS: ${{ vars.VN_WEEKLY_MAX_HISTORY_CALLS || '20' }}
          VN_WEEKLY_SECTOR_OFFSET: ${{ github.run_number }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m stock_utils.jobs.daily_screen_vn_job

      - name: Upload VN screening artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-screen-vn-output
          path: |
            data/sectors-vn.json
            data/sectors-vn/
            data/output-vn/
          if-no-files-found: warn

      # Intentionally skip Pages deploy here to avoid overwriting the US site.
      # VN output remains available through workflow artifacts.
