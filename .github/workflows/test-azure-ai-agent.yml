name: Test Azure AI Agent (TSLA & MSFT)

on:
  workflow_dispatch:
    inputs:
      prompts:
        description: >
          Newline-separated prompts to send to the agent.
          Default runs TSLA and MSFT full analysis.
        required: false
        default: |
          Analyze TSLA with 180-day context.
          Analyze MSFT with 180-day context.
      stream:
        description: "Enable streaming output (true/false)"
        required: false
        default: "false"
      refresh_agent:
        description: "Refresh the Foundry agent/tool before tests (true/false)"
        required: false
        default: "false"
      agent_model_deployment:
        description: "Optional model deployment override used when refreshing the agent or recreating a missing agent"
        required: false
        default: ""

jobs:
  test-agent:
    name: Run Azure AI Foundry agent end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      STOCK_TOOLS_API_BASE_URL: ${{ vars.STOCK_TOOLS_API_BASE_URL || 'https://stock-tools-api-dev-app.calmstone-a9644956.eastus.azurecontainerapps.io' }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT || 'https://stock-helper-resource.services.ai.azure.com/api/projects/stock-helper' }}
      AZURE_AI_AGENT_NAME: ${{ vars.AZURE_AI_AGENT_NAME || 'stock-forecast-agent' }}
      REFRESH_AGENT: ${{ github.event.inputs.refresh_agent || 'false' }}
      AZURE_AI_AGENT_MODEL_DEPLOYMENT: ${{ github.event.inputs.agent_model_deployment || vars.AZURE_AI_AGENT_MODEL_DEPLOYMENT || '' }}
      AZURE_AI_OPENAPI_CONNECTION_ID: ${{ secrets.AZURE_AI_OPENAPI_CONNECTION_ID || '' }}
      AZURE_AI_OPENAPI_CONNECTION_NAME: ${{ vars.AZURE_AI_OPENAPI_CONNECTION_NAME || '' }}
      AZURE_AI_AGENT_API_VERSION: ${{ vars.AZURE_AI_AGENT_API_VERSION || '2025-11-15-preview' }}
      AZURE_AI_OPENAPI_API_KEY_HEADER_NAME: ${{ vars.AZURE_AI_OPENAPI_API_KEY_HEADER_NAME || 'x-api-key' }}
      STOCK_TOOLS_OPENAPI_URL: ${{ vars.STOCK_TOOLS_OPENAPI_URL || 'https://stock-tools-api-dev-app.calmstone-a9644956.eastus.azurecontainerapps.io/openapi.json' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install agent dependencies
        run: pip install -r requirements.txt --quiet

      - name: Validate required secrets and vars
        env:
          STOCK_TOOLS_API_KEY: ${{ secrets.STOCK_TOOLS_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          python - <<'EOF'
          import os, sys
          refresh_agent = os.getenv('REFRESH_AGENT', '') == 'true'
          required = {
              'STOCK_TOOLS_API_KEY': os.getenv('STOCK_TOOLS_API_KEY', ''),
              'AZURE_CLIENT_ID': os.getenv('AZURE_CLIENT_ID', ''),
              'AZURE_CLIENT_SECRET': os.getenv('AZURE_CLIENT_SECRET', ''),
              'AZURE_TENANT_ID': os.getenv('AZURE_TENANT_ID', ''),
              'AZURE_SUBSCRIPTION_ID': os.getenv('AZURE_SUBSCRIPTION_ID', ''),
          }
          missing = [name for name, value in required.items() if not value.strip()]
          if missing:
              print('::error::Missing required GitHub secrets / vars: ' + ', '.join(missing))
              sys.exit(1)

          model = os.getenv('AZURE_AI_AGENT_MODEL_DEPLOYMENT', '').strip()
          connection_id = os.getenv('AZURE_AI_OPENAPI_CONNECTION_ID', '').strip()
          connection_name = os.getenv('AZURE_AI_OPENAPI_CONNECTION_NAME', '').strip()

          if model:
              print(f'✅ Found AZURE_AI_AGENT_MODEL_DEPLOYMENT={model}. Workflow will reuse that deployment when refreshing the agent.')
          else:
              print('::notice::AZURE_AI_AGENT_MODEL_DEPLOYMENT is not set. The setup script will auto-resolve a model deployment from the Foundry project after Azure login.')

          if connection_id:
              print('✅ Found AZURE_AI_OPENAPI_CONNECTION_ID. Any refresh run will provision the tool with project-connection auth.')
          elif connection_name:
              print(f'::notice::AZURE_AI_OPENAPI_CONNECTION_NAME={connection_name}. The setup script will resolve its connection ID after Azure login.')
          else:
              print('::notice::No explicit Foundry connection ID/name was provided. The setup script will attempt to auto-resolve a matching CustomKeys connection for the Stock Tools API.')

          if refresh_agent:
              if model:
                  print(f'✅ REFRESH_AGENT=true. Workflow will refresh the agent registration with model {model}.')
              else:
                  print('::notice::REFRESH_AGENT=true. Workflow will refresh the agent registration and let the setup script auto-resolve the model deployment.')
          else:
              print('::notice::REFRESH_AGENT is false. Workflow will test the existing Foundry agent without reprovisioning it.')

          print('✅ Required secrets and vars are present for the selected workflow mode.')
          EOF

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Validate Stock Tools API pipeline
        env:
          STOCK_TOOLS_API_KEY: ${{ secrets.STOCK_TOOLS_API_KEY }}
        run: |
          python - <<'EOF'
          import os, subprocess, sys
          env = os.environ.copy()
          try:
              subprocess.run([sys.executable, 'test_api_calls.py', 'TSLA'], check=True, env=env)
          except subprocess.CalledProcessError as exc:
              print(f"::error::Stock Tools API validation failed with exit code {exc.returncode}")
              sys.exit(exc.returncode)
          EOF

      - name: Refresh Foundry agent OpenAPI tool registration
        if: ${{ env.REFRESH_AGENT == 'true' }}
        env:
          STOCK_TOOLS_API_KEY: ${{ secrets.STOCK_TOOLS_API_KEY }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_AI_FOUNDRY_HUB_RESOURCE_GROUP: ${{ vars.AZURE_AI_FOUNDRY_HUB_RESOURCE_GROUP || '' }}
        run: |
          python infra/azure/foundry-agent-setup.py

      - name: Ensure Foundry agent exists
        if: ${{ env.REFRESH_AGENT != 'true' }}
        env:
          STOCK_TOOLS_API_KEY: ${{ secrets.STOCK_TOOLS_API_KEY }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_AI_FOUNDRY_HUB_RESOURCE_GROUP: ${{ vars.AZURE_AI_FOUNDRY_HUB_RESOURCE_GROUP || '' }}
        run: |
          set +e
          python run_agent.py --check-agent
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Existing Foundry agent is reachable; continuing without refresh."
          elif [ "$status" -eq 10 ]; then
            if [ -n "${AZURE_AI_AGENT_MODEL_DEPLOYMENT}" ]; then
              echo "Configured Foundry agent was not found. Recreating it with AZURE_AI_AGENT_MODEL_DEPLOYMENT=${AZURE_AI_AGENT_MODEL_DEPLOYMENT}."
              python infra/azure/foundry-agent-setup.py --model "${AZURE_AI_AGENT_MODEL_DEPLOYMENT}"
            else
              echo "Configured Foundry agent was not found and AZURE_AI_AGENT_MODEL_DEPLOYMENT is empty. Attempting automatic reprovisioning via foundry-agent-setup.py."
              set +e
              python infra/azure/foundry-agent-setup.py
              reprovision_status=$?
              set -e

              if [ "$reprovision_status" -ne 0 ]; then
                echo "::error::Automatic reprovisioning failed with exit code ${reprovision_status}."
                echo "::error::If the failure mentions Foundry deployments/read, either grant that permission or set the workflow input agent_model_deployment (or repo var AZURE_AI_AGENT_MODEL_DEPLOYMENT) to an existing deployment name."
                exit "$reprovision_status"
              fi
            fi
          else
            echo "::error::Agent reachability check failed with exit code $status"
            exit "$status"
          fi

      - name: Run configured prompts through the agent
        run: |
          python - <<'EOF'
          import os, subprocess, sys

          raw_prompts = """${{ github.event.inputs.prompts || 'Analyze TSLA with 180-day context.\nAnalyze MSFT with 180-day context.' }}"""
          prompts = [line.strip() for line in raw_prompts.splitlines() if line.strip()]
          if not prompts:
              print('::error::No prompts provided to workflow_dispatch input.')
              sys.exit(1)

          stream_flag = ['--stream'] if "${{ github.event.inputs.stream || 'false' }}".lower() == 'true' else []

          for prompt in prompts:
              print('━' * 76)
              print(f'AGENT CALL: {prompt}')
              print('━' * 76)
              subprocess.run([sys.executable, 'run_agent.py', *stream_flag, prompt], check=True)
          EOF

      - name: Run full --tests suite (TSLA, NVDA, invalid ticker)
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Full test suite — verifies tool call order:"
          echo "    price_history → technicals → news_sentiment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          python run_agent.py --tests
