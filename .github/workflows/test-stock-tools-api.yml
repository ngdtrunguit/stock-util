name: Test Stock Tools API (TSLA & MSFT)

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers to test (default: TSLA MSFT)"
        required: false
        default: "TSLA MSFT"

jobs:
  test-api:
    name: Call deployed API and print responses
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Run API validation
        env:
          STOCK_TOOLS_API_KEY: ${{ secrets.STOCK_TOOLS_API_KEY }}
        run: |
          python test_api_calls.py ${{ github.event.inputs.tickers || 'TSLA MSFT' }}
