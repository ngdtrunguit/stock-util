name: Daily Stock Screen

on:
  schedule:
    # Every weekday at 00:00 UTC
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT || 'https://stock-helper-resource.services.ai.azure.com/api/projects/stock-helper' }}
      AGENT_NAME: ${{ vars.AZURE_AI_AGENT_NAME || 'stock-forecast-agent' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        id: install
        env:
          PIP_CACHE_DIR: ~/.cache/pip
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Restore screening database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data

          artifact_id="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "stock-screen-db" and .expired == false)] | sort_by(.created_at) | last | .id // empty')"

          # Safety: strip any accidental whitespace/newlines
          artifact_id="${artifact_id%%[[:space:]]*}"

          if [ -z "${artifact_id}" ]; then
            echo "No prior stock-screen-db artifact found; starting with a fresh database."
            exit 0
          fi

          echo "Restoring stock-screen-db artifact ${artifact_id}"
          gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > /tmp/stock-screen-db.zip
          unzip -o /tmp/stock-screen-db.zip -d data

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Run daily screen job
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: "1421"
          TELEGRAM_AI_TOP_PICKS_THREAD_ID: "1439"
          PYTHONUNBUFFERED: "1"
        run: |
          python -m stock_utils.jobs.daily_screen_job

      # Replace the previous artifact with the updated database file.
      # The SQLite file itself accumulates rows from every run;
      # overwrite replaces the stale artifact copy with the current one.
      - name: Upload screening database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-screen-db
          path: data/stock_screen.db
          if-no-files-found: warn
          overwrite: true

      - name: Upload daily output artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-screen-output
          path: data/output/
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: data/output/

  deploy:
    if: ${{ github.ref_name == 'main' }}
    needs: screen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
