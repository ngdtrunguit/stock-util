name: Monthly Sector Sync

on:
  schedule:
    # 1st of every month at 09:00 UTC
    - cron: "0 9 1 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run monthly sector sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          python -m stock_utils.jobs.monthly_sector_job

      - name: Commit updated sectors.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update sectors.json [monthly-sync]"
          file_pattern: data/sectors.json
